name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # aarch64: exercises the NEON path
          - os: macos-14
            python: "3.11"
            expect_simd: neon
          - os: macos-14
            python: "3.13"
            expect_simd: neon
          # x86_64: exercises the runtime-dispatched AVX2 path
          - os: ubuntu-latest
            python: "3.9"
            expect_simd: avx2
          - os: ubuntu-latest
            python: "3.11"
            expect_simd: avx2
          - os: ubuntu-latest
            python: "3.13"
            expect_simd: avx2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: Report active SIMD kernel
        run: python -c "import myers_batch, platform; print(platform.machine(), 'backend=', myers_batch.simd_backend(), 'lanes=', myers_batch.lanes())"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest --cov=myers_batch --cov-branch --cov-report=term-missing --cov-fail-under=100 -q
        env:
          MYERS_EXPECT_SIMD: ${{ matrix.expect_simd }}
