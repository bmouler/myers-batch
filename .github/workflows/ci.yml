name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native aarch64: exercises the NEON path on macOS and Linux
          - os: macos-14
            python: "3.11"
            expect_simd: neon
          - os: macos-14
            python: "3.13"
            expect_simd: neon
          - os: ubuntu-24.04-arm
            python: "3.12"
            expect_simd: neon
          # Native x86_64: exercises the runtime-dispatched AVX2 path
          - os: ubuntu-latest
            python: "3.9"
            expect_simd: avx2
          - os: ubuntu-latest
            python: "3.11"
            expect_simd: avx2
          - os: ubuntu-latest
            python: "3.13"
            expect_simd: avx2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Report active SIMD kernel
        run: python -c "import myers_batch, platform; print(platform.machine(), 'backend=', myers_batch.simd_backend(), 'lanes=', myers_batch.lanes())"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m pytest --cov=myers_batch --cov-branch --cov-report=term-missing --cov-fail-under=100 -q
        env:
          MYERS_EXPECT_SIMD: ${{ matrix.expect_simd }}
